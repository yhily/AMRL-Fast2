# Paper-protocol extension: Walker2d-v2. Do not change these training values
# without creating a separate experimental condition.
environment:
  env_name: Walker2d-v2
  allow_version_fallback: false
training:
  total_timesteps: 100000
  adaptation_interval: 10000
  warmup_steps: 10000
  transition_steps: 10000
evaluation:
  episodes: 20
seeds: [0, 1, 2, 3, 4]
device: auto
output_dir: results
fast_backend:
  # Rebuilt four-gate candidates. Runtime admission is device-specific; the
  # fastest fidelity-passing route is selected for the run.
  name: AMRL-Fast-Rebuilt-Kernel
  require_optimized_backend: true
