# Formal continuous-control extension.  The environment identifier is the
# exact resolved Gymnasium/MuJoCo version used in reporting.
environment:
  env_name: Walker2d-v4
  allow_version_fallback: false
training:
  total_timesteps: 100000
  adaptation_interval: 10000
  warmup_steps: 10000
  transition_steps: 10000
  checkpoint_interval: 10000
  controller_start_after_steps: 0
  controller_hidden_size: 256
  controller_batched_replay: true
  enable_rollout_backend: true
evaluation:
  episodes: 20
seeds: [0, 1, 2, 3, 4]
device: auto
output_dir: results
fast_backend:
  name: AMRL-Fast-Rebuilt-Kernel
  require_optimized_backend: true
