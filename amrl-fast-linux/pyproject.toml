[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amrl-fast-experiments"
version = "0.1.0"
description = "Linux experiment harness for AMRL and AMRL-Fast benchmarks"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["amrl_fast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
